<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora</title>
<meta name="theme-color" content="#14151A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151A; --bg-elev:#1D1F26; --paper:#ECE4D3; --ink:#23262B;
    --text-primary:#ECEAE3; --text-muted:#8B8D97;
    --accent-capture:#E2572B; --accent-note:#2F7A6B; --danger:#E27A6B; --border:#2B2D35;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text-primary);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; justify-content:center; min-height:100dvh;
  }
  #app{width:100%; max-width:480px; display:flex; flex-direction:column; min-height:100dvh; position:relative;}

  header{
    padding:20px 20px 14px; border-bottom:1px solid var(--border);
    background:var(--bg-elev); position:sticky; top:0; z-index:5;
  }
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  header h1{margin:0; font-family:'Source Serif 4',Georgia,serif; font-weight:600; font-size:26px;}
  header p{margin:4px 0 0; font-size:13px; color:var(--text-muted); overflow-wrap:anywhere;}
  #logout-btn{
    background:transparent; color:var(--text-muted); border:1px solid var(--border);
    border-radius:20px; padding:7px 14px; font-size:13px; font-family:inherit; cursor:pointer; flex-shrink:0;
  }
  #logout-btn:active{background:var(--border);}

  #login-view{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 20px 60px;}
  #login-form{display:flex; flex-direction:column; gap:14px;}
  #login-form label{font-size:13px; color:var(--text-muted); display:flex; flex-direction:column; gap:6px;}
  #login-form input{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:12px;
    color:var(--text-primary); font-family:inherit; font-size:16px; padding:13px 14px; outline:none;
  }
  #login-form input:focus{border-color:var(--accent-note);}
  #login-btn{
    background:var(--accent-note); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:6px;
  }
  #login-btn:disabled{background:#3a3d46; color:#6b6d76; cursor:default;}
  #login-error{min-height:20px; margin:0; font-size:13px; color:var(--danger);}
  .pass-wrap{position:relative; display:block;}
  .pass-wrap input{width:100%; padding-right:78px;}
  #toggle-pass{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; color:var(--text-muted);
    font-family:inherit; font-size:13px; padding:8px 10px; cursor:pointer;
  }
  #toggle-pass:active{color:var(--text-primary);}

  #main-view{flex:1; display:flex; flex-direction:column;}
  #feed{flex:1; padding:16px 16px 160px; display:flex; flex-direction:column; gap:18px;}

  .day-label{
    font-size:12px; font-weight:600; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:0.06em; margin:6px 2px 0;
  }
  .entry{
    background:var(--paper); color:var(--ink); border-radius:14px; padding:14px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,0.25); position:relative;
  }
  .entry-time{font-size:11px; color:#6b6d76; margin-bottom:6px; display:block;}
  .entry-text{
    font-family:'Source Serif 4',Georgia,serif; font-size:16.5px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; margin:0; padding-right:24px;
  }
  .entry-photo{width:100%; border-radius:9px; display:block; margin-top:8px;}
  .entry-del{
    position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.08); color:#5c5e66; font-size:14px; line-height:1; cursor:pointer;
  }
  .entry-del:active{background:rgba(0,0,0,0.16);}

  #empty-state{margin-top:60px; text-align:center; color:var(--text-muted); padding:0 30px;}
  #empty-state .glyph{font-family:'Source Serif 4',Georgia,serif; font-size:42px; color:var(--border); margin-bottom:10px;}
  #empty-state p{font-size:14px; line-height:1.5;}

  #capture-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:linear-gradient(180deg, rgba(20,21,26,0) 0%, var(--bg) 28%);
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:6;
  }
  #compose{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:16px;
    padding:10px 10px 10px 16px; display:flex; align-items:flex-end; gap:8px;
  }
  #note-input{
    flex:1; background:transparent; border:none; color:var(--text-primary);
    font-family:'Inter',system-ui,sans-serif; font-size:15px; resize:none; outline:none;
    max-height:120px; line-height:1.4; padding:8px 0;
  }
  #note-input::placeholder{color:var(--text-muted);}
  .icon-btn{
    border:none; border-radius:50%; width:42px; height:42px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;
  }
  #photo-btn{background:var(--accent-capture);}
  #save-btn{background:var(--accent-note);}
  #save-btn:disabled{background:#3a3d46; color:#6b6d76; cursor:default;}
  #photo-input{display:none;}
  #photo-preview-strip{display:flex; gap:6px; padding:0 4px 8px; overflow-x:auto;}
  #photo-preview-strip img{width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--border);}

  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:var(--paper); color:var(--ink); padding:9px 16px; border-radius:20px;
    font-size:13px; opacity:0; transition:all .25s ease; z-index:20; pointer-events:none; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-row">
      <div>
        <h1>Bitácora</h1>
        <p id="subtitle">Cargando…</p>
      </div>
      <button id="logout-btn" type="button" hidden>Salir</button>
    </div>
  </header>

  <section id="login-view" hidden>
    <form id="login-form">
      <label>Correo
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label>Contraseña
        <span class="pass-wrap">
          <input id="login-pass" type="password" autocomplete="current-password" required>
          <button id="toggle-pass" type="button" aria-label="Mostrar contraseña">Ver</button>
        </span>
      </label>
      <p id="login-error" role="alert"></p>
      <button id="login-btn" type="submit">Entrar</button>
    </form>
  </section>

  <section id="main-view" hidden>
    <div id="feed"></div>
    <div id="capture-bar">
      <div id="photo-preview-strip"></div>
      <div id="compose">
        <textarea id="note-input" placeholder="Escribe un apunte…" rows="1"></textarea>
        <input type="file" id="photo-input" accept="image/*" capture="environment" multiple>
        <button class="icon-btn" id="photo-btn" type="button" title="Tomar foto" aria-label="Tomar foto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.3" stroke="white" stroke-width="1.8"/></svg>
        </button>
        <button class="icon-btn" id="save-btn" type="button" title="Guardar" aria-label="Guardar" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div id="toast"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
