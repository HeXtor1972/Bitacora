<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora</title>
<meta name="theme-color" content="#14151A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151A;
    --bg-elev:#1D1F26;
    --paper:#ECE4D3;
    --ink:#23262B;
    --text-primary:#ECEAE3;
    --text-muted:#8B8D97;
    --accent-capture:#E2572B;
    --accent-note:#2F7A6B;
    --danger:#C24343;
    --border:#2B2D35;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }
  #app{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
  }

  header{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--border);
    background:var(--bg-elev);
    position:sticky;
    top:0;
    z-index:5;
  }
  header h1{
    margin:0;
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.2px;
  }
  header p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--text-muted);
  }

  #feed{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 140px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .day-label{
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:6px 2px 0;
  }

  .entry{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
    position:relative;
  }
  .entry-time{
    font-size:11px;
    color:#6b6d76;
    margin-bottom:6px;
    display:block;
  }
  .entry-text{
    font-family:'Source Serif 4', Georgia, serif;
    font-size:16.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    margin:0;
  }
  .entry-photo{
    width:100%;
    border-radius:9px;
    display:block;
    margin-top:8px;
  }
  .entry-photo:first-child{margin-top:0;}

  .entry-del{
    position:absolute;
    top:10px;
    right:10px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,0.08);
    color:#5c5e66;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  .entry-del:active{background:rgba(0,0,0,0.16);}

  #empty-state{
    margin-top:60px;
    text-align:center;
    color:var(--text-muted);
    padding:0 30px;
  }
  #empty-state .glyph{
    font-family:'Source Serif 4', Georgia, serif;
    font-size:42px;
    color:var(--border);
    margin-bottom:10px;
  }
  #empty-state p{font-size:14px; line-height:1.5;}

  #capture-bar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:linear-gradient(180deg, rgba(20,21,26,0) 0%, var(--bg) 28%);
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    z-index:6;
  }
  #compose{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px 10px 10px 16px;
    display:flex;
    align-items:flex-end;
    gap:8px;
  }
  #note-input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-primary);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    resize:none;
    outline:none;
    max-height:120px;
    line-height:1.4;
    padding:8px 0;
  }
  #note-input::placeholder{color:var(--text-muted);}

  .icon-btn{
    border:none;
    border-radius:50%;
    width:42px;
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
  }
  #photo-btn{background:var(--accent-capture);}
  #save-btn{background:var(--accent-note);}
  #save-btn:disabled{background:#3a3d46; color:#6b6d76; cursor:default;}

  #photo-input{display:none;}

  #photo-preview-strip{
    display:flex;
    gap:6px;
    padding:0 4px 8px;
    overflow-x:auto;
  }
  #photo-preview-strip img{
    width:56px;height:56px;object-fit:cover;border-radius:8px;
    border:1px solid var(--border);
  }

  #toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:var(--ink);
    color:var(--paper);
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    transition:all .25s ease;
    z-index:20;
    pointer-events:none;
    white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bitácora</h1>
    <p>Apuntes y fotos, guardados en este teléfono</p>
  </header>

  <div id="feed"></div>

  <div id="capture-bar">
    <div id="photo-preview-strip"></div>
    <div id="compose">
      <textarea id="note-input" placeholder="Escribe un apunte…" rows="1"></textarea>
      <input type="file" id="photo-input" accept="image/*" capture="environment" multiple>
      <button class="icon-btn" id="photo-btn" title="Tomar foto" aria-label="Tomar foto">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.3" stroke="white" stroke-width="1.8"/></svg>
      </button>
      <button class="icon-btn" id="save-btn" title="Guardar" aria-label="Guardar" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const DB_NAME = 'bitacora-db';
const STORE = 'entries';
let db;
let pendingPhotos = [];

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)){
        const s = d.createObjectStore(STORE, {keyPath:'id'});
        s.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function addEntry(entry){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).add(entry);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function deleteEntry(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function getAllEntries(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result.sort((a,b)=> b.timestamp - a.timestamp));
